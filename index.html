<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fermi League</title>
<meta name="description" content="A private estimation league.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate">
  <div class="gate-card" id="gate-card">
    <div class="gate-mark">&#402;</div>
    <h1 class="gate-title">Fermi League</h1>
    <p class="gate-sub" id="gate-sub">A private estimation league.<br>Enter the join code to get in.</p>

    <p class="gate-status" id="gate-status" hidden>Checking&hellip;</p>

    <div id="gate-form">
      <input type="text" id="gate-code" class="gate-input" placeholder="Join code" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="gate-submit" class="gate-btn">Enter</button>
      <p class="gate-error" id="gate-error"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="gate.js"></script>
</body>
</html>
